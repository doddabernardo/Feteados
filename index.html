<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feteados - Distribuidora Mayorista y Minorista</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
        }
        header p {
            color: #aaa;
            font-size: 1.1rem;
        }
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #333;
        }
        .card-content {
            padding: 20px;
        }
        .card-content h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .card-content p {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4ade80;
        }
    </style>
</head>
<body>

    <header>
        <h1>Feteados</h1>
        <p>Distribuidora Mayorista y Minorista</p>
    </header>

    <div class="catalog" id="catalog">
        <!-- Producto 1 -->
        <div class="card">
            <img src="imagen-queso-1.jpg" alt="Queso Feteado">
            <div class="card-content">
                <h3>Queso en Barra / Feteado</h3>
                <p>Calidad superior para distribución comercial y gastronómica.</p>
                <div class="price">Consultar Stock</div>
            </div>
        </div>

        <!-- Producto 2 -->
        <div class="card">
            <img src="imagen-queso-2.jpg" alt="Mozzarella">
            <div class="card-content">
                <h3>Mozzarella Especial</h3>
                <p>Ideal para melting, excelente rendimiento y sabor.</p>
                <div class="price">Consultar Stock</div>
            </div>
        </div>
    </div>

</body>
</html>
